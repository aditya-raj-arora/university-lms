apiVersion: apps/v1
kind: Deployment
metadata:
  name: university-lms
  labels:
    app: university-lms
  annotations:
    kubernetes.io/change-cause: "Initial release"
spec:
  replicas: 2
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 60
  minReadySeconds: 5
  selector:
    matchLabels:
      app: university-lms
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: university-lms
    spec:
      containers:
        - name: university-lms
          image: YOUR_DOCKERHUB_USERNAME/university-lms:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
